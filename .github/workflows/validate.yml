name: Validate OSRS Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Tests, production build, and versioned ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Package versioned source and production bundle
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release
          zip -r "release/osrshub-${VERSION}-source.zip" . -x '.git/*' 'node_modules/*' 'dist/*' 'release/*'
          zip -r "release/osrshub-${VERSION}-production-site.zip" site
          printf 'OSRS Hub %s\nCommit: %s\nValidation: npm test + npm run build passed\n' "$VERSION" "$GITHUB_SHA" > release/BUILD-INFO.txt
      - name: Upload versioned build archives
        uses: actions/upload-artifact@v4
        with:
          name: osrshub-${{ github.sha }}-build-zips
          path: release/*
          if-no-files-found: error
          retention-days: 30
